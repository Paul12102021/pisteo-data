name: Parcours balisés (OpenStreetMap)

on:
  schedule:
    - cron: '17 3 1,15 * *'   # le 1er et le 15 de chaque mois, 3 h 17 UTC
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ['build.py', 'poi.py', '.github/workflows/build.yml']

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Outils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install -q osmium

      - name: Extrait France (Geofabrik)
        run: |
          curl -fsSL --retry 3 -o france.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf \
            || curl -fsSL --retry 3 -o france.osm.pbf https://download.openstreetmap.fr/extracts/europe/france-latest.osm.pbf  # secours si Geofabrik est en panne
          ls -lh france.osm.pbf
          mkdir -p polys   # contour de chaque extrait : zones couvertes (cover.json)
          curl -fsSL --retry 3 -o polys/france.poly https://download.geofabrik.de/europe/france.poly

      - name: Garder seulement les parcours balisés
        run: |
          osmium tags-filter france.osm.pbf r/route=hiking,foot,bicycle,mtb -o routes-france.osm.pbf
          # points utiles : eau, sources, toilettes, abris, refuges et cabanes, commerces d'alimentation
          osmium tags-filter france.osm.pbf $POI -o poi-france.osm.pbf
          rm france.osm.pbf
        env:
          POI: nw/amenity=drinking_water,toilets,shelter,fountain nw/natural=spring,peak nw/tourism=alpine_hut,wilderness_hut,viewpoint nw/man_made=water_tap nw/shop=supermarket,convenience,general,greengrocer,deli,farm,bakery,pastry nw/tourism=camp_site,hostel,guest_house,hotel n/railway=station,halt nw/amenity=bus_station

      - name: Parcours balisés et points utiles des pays voisins (un pays à la fois, pour la place disque)
        env:
          POI: nw/amenity=drinking_water,toilets,shelter,fountain nw/natural=spring,peak nw/tourism=alpine_hut,wilderness_hut,viewpoint nw/man_made=water_tap nw/shop=supermarket,convenience,general,greengrocer,deli,farm,bakery,pastry nw/tourism=camp_site,hostel,guest_house,hotel n/railway=station,halt nw/amenity=bus_station
        run: |
          for c in andorra belgium luxembourg switzerland austria spain italy germany great-britain; do
            curl -fsSL --retry 3 -o c.osm.pbf "https://download.geofabrik.de/europe/$c-latest.osm.pbf" || { echo "échec $c"; continue; }
            osmium tags-filter c.osm.pbf $POI -o "poi-$c.osm.pbf"
            # parcours balisés du pays, et contour de l'extrait (seulement si les parcours sont là)
            if osmium tags-filter c.osm.pbf r/route=hiking,foot,bicycle,mtb -o "routes-$c.osm.pbf"; then
              curl -fsSL --retry 3 -o "polys/$c.poly" "https://download.geofabrik.de/europe/$c.poly" || rm -f "routes-$c.osm.pbf"
            fi
            rm c.osm.pbf
          done
          osmium merge poi-*.osm.pbf -o poi.osm.pbf
          rm poi-*.osm.pbf
          ls -lh routes-*.osm.pbf
          # un parcours qui passe une frontière est dans deux extraits : la fusion le garde une seule fois, avec tous ses chemins
          osmium merge routes-*.osm.pbf -o routes.osm.pbf
          rm routes-*.osm.pbf
          ls -lh poi.osm.pbf routes.osm.pbf polys

      - name: Préparer les tuiles
        run: |
          /usr/bin/time -v python3 build.py routes.osm.pbf out polys 2> build.time || { tail -30 build.time; exit 1; }
          grep -E 'Maximum resident|Elapsed' build.time
          python3 poi.py poi.osm.pbf out

      - name: Garder les photos et lieux déjà calculés (info.py)
        run: |
          git clone -q --depth 1 -b gh-pages "https://github.com/${{ github.repository }}.git" prev || exit 0
          if [ -d prev/i ]; then cp -r prev/i out/i; fi
          if [ -f prev/info.json ]; then cp prev/info.json out/; fi
          rm -rf prev

      - name: Publier sur la branche gh-pages (sans historique)
        run: |
          cd out
          touch .nojekyll
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Pisteo · données</title>
          <p>Parcours balisés pour l'appli Pisteo, préparés chaque mois.<br>
          Données © contributeurs <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> (ODbL).
          Voir <a href="manifest.json">manifest.json</a>.</p>
          HTML
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Données du $(date +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
